<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学员跟进系统 - 原型展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @layer utilities {
            .app-container {
                max-width: 480px;
                margin: 0 auto;
                background: #fff;
                min-height: 100vh;
                position: relative;
                overflow-x: hidden;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            }
        }

        body {
            background-color: #f3f4f6;
        }
    </style>
</head>

<body>
    <div class="app-container flex flex-col">
        <!-- Header -->
        <div class="bg-white px-4 py-3 flex items-center justify-between border-b border-gray-100">
            <i class="fa fa-chevron-left text-gray-400"></i>
            <h1 class="font-bold text-gray-800">学员跟进</h1>
            <i class="fa fa-ellipsis-h text-gray-400"></i>
        </div>

        <!-- Student Info -->
        <div class="p-4 bg-white border-b border-gray-100 shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <span class="text-xl font-bold">测试学员</span>
                    <i class="fa fa-venus text-pink-400"></i>
                </div>
                <div class="text-teal-500 text-sm bg-teal-50 px-2 py-1 rounded-full">学员(9)</div>
            </div>

            <div class="flex gap-2 mb-4 overflow-x-auto whitespace-nowrap">
                <span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs italic"># 意向强烈</span>
                <span class="bg-teal-50 text-teal-600 px-2 py-1 rounded text-xs">+ 标签</span>
            </div>
        </div>

        <!-- Placement Data Placeholder -->
        <div class="flex-1 p-4 bg-gray-50">
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 mb-4">
                <div class="flex items-center gap-2 mb-3 bg-indigo-50 p-2 rounded-lg">
                    <span class="font-bold text-xs text-indigo-700">2027秋季</span>
                    <span class="bg-indigo-500 text-white text-[8px] px-1 py-0.5 rounded ml-auto">最新成绩</span>
                </div>
                <div class="space-y-2 text-sm text-gray-500 italic">
                    [学情数据已抽离至 placementData.json]
                </div>
            </div>
        </div>

        <!-- Note -->
        <div class="px-4 py-3 bg-white border-t border-gray-100 text-center">
            <p class="text-[10px] text-gray-400 italic">请运行 React 工程以查阅完整交互与数据绑定。</p>
        </div>
    </div>
</body>

</html>
