<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老带新专属活动 - 原型展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @layer utilities {
            .app-container {
                max-width: 480px;
                margin: 0 auto;
                background: #fff;
                min-height: 100vh;
                position: relative;
                overflow-x: hidden;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            }

            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
        }

        body {
            background-color: #f3f4f6;
        }
    </style>
</head>

<body>
    <div class="app-container flex flex-col">
        <!-- Header -->
        <div class="bg-white border-b border-gray-100 px-4 py-3 flex items-center gap-3 sticky top-0 z-20">
            <i class="fa fa-chevron-left text-gray-400 cursor-pointer"></i>
            <h1 class="font-bold text-gray-800 text-base">老带新专属活动</h1>
        </div>

        <!-- Dynamic Content Example (小学) -->
        <div class="flex-1 p-4 overflow-y-auto">
            <div class="mb-2">
                <div class="flex items-center gap-2 mb-3">
                    <span class="w-2.5 h-2.5 rounded-full bg-orange-400"></span>
                    <span class="font-bold text-gray-700 text-sm">推荐小学新生</span>
                    <span class="text-gray-300 text-xs">2 个活动</span>
                </div>

                <!-- Activity Card 1 -->
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 mb-4">
                    <div class="relative w-full aspect-[16/9] bg-gray-100">
                        <div class="absolute inset-0 flex items-center justify-center text-gray-300 text-xs italic">16:9
                            宣传海报</div>
                    </div>
                    <div class="px-3 py-2.5 flex items-center justify-between">
                        <span
                            class="text-[10px] font-bold px-2 py-1 rounded-full bg-orange-100 text-orange-600">推荐小学新生</span>
                        <button
                            class="px-4 py-1.5 rounded-full text-xs font-bold bg-teal-500 text-white shadow-sm">立即参与</button>
                    </div>
                </div>

                <!-- Activity Card 2 -->
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 mb-4">
                    <div class="relative w-full aspect-[16/9] bg-gray-100">
                        <div class="absolute inset-0 flex items-center justify-center text-gray-300 text-xs italic">16:9
                            宣传海报</div>
                    </div>
                    <div class="px-3 py-2.5 flex items-center justify-between">
                        <span
                            class="text-[10px] font-bold px-2 py-1 rounded-full bg-orange-100 text-orange-600">推荐小学新生</span>
                        <button
                            class="px-4 py-1.5 rounded-full text-xs font-bold bg-teal-500 text-white shadow-sm">立即参与</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Note -->
        <div class="px-4 py-3 bg-gray-50 border-t border-gray-100 text-center">
            <p class="text-[10px] text-gray-400 italic">此 HTML 文件仅供结构预览，动态逻辑请运行 React App。</p>
        </div>
    </div>
</body>

</html>
